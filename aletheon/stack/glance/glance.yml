# Glance config (DESIGN.md §5/§8.2 point 8). Glance hot-reloads this file AND the
# $include'd theme on save (fsnotify, server-side); the kiosk iframe refresh comes from
# watcherd's SSE — glance events carry an extra delay so the reparse lands first.
# Glance is iframed DIRECTLY from 127.0.0.1:8085 (own origin, off the gateway — review);
# widget URLs below are fetched from INSIDE the bridge-mode container, so they may only
# target the container itself (localhost:8080 = glance's own server). GPU telemetry lives
# in the shell's status strip (same-origin /metrics/gpu via the gateway), not here.
server:
  assets-path: /app/assets

theme:
  $include: themes/active.yml

pages:
  - name: Machine
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: aletheon

      - size: full
        widgets:
          - type: group
            widgets:
              - type: hacker-news
              - type: rss
                title: KDE / Plasma
                feeds:
                  - url: https://pointieststick.com/feed/
          - type: reddit
            subreddit: LocalLLaMA

      - size: small
        widgets:
          - type: clock
            hour-format: 24h
          - type: custom-api
            title: Mode
            url: http://localhost:8080/assets/state/mode.json   # glance's own server
            cache: 10s
            template: |
              <div>persona: <b>{{ .JSON.String "mode" }}</b></div>
          - type: bookmarks
            groups:
              - title: Panels
                links:
                  - title: Photos (Immich)
                    url: http://127.0.0.1:2283
                  - title: Pipeline (Twenty)
                    url: http://127.0.0.1:3010
